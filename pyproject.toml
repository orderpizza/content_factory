[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "content-factory"
version = "0.1.0"
description = "Local-first automated content factory proof of concept"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "playwright>=1.48.0,<1.60.0",
    "boto3>=1.34.0",
    "Pillow>=10.0.0",
    "sentence-transformers>=5.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools==80.9.0", "wheel==0.45.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
